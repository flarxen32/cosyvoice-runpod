name: Build and Push to GHCR

# Constrói a imagem Docker x86_64 e pusha para GitHub Container Registry.
# O RunPod referencia esta imagem via saveTemplate GraphQL.
# Runs ilimitados para repos públicos (GitHub Actions free tier).

on:
  push:
    branches: [main]
  workflow_dispatch:  # permite trigger manual

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # runner x86_64 nativo
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write  # precisa de write para pushar para GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # token automático do Actions

      - name: Extract metadata
        id: meta
        run: |
          echo "IMAGE_LOWER=$(echo $IMAGE_NAME | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "TAG=latest" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_LOWER }}:${{ env.TAG }}
            ghcr.io/${{ env.IMAGE_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Image digest
        run: echo "Image pushed to ghcr.io/${{ env.IMAGE_LOWER }}:latest"
